<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DATA CỨNG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body {
      font-family: 'Inter', system-ui, sans-serif;
    }
    .total-card {
      background: linear-gradient(135deg, #00d4ff, #0099cc);
    }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen pb-12">

  <!-- GIAO DIỆN CHƯA ĐĂNG NHẬP -->
  <div id="loginScreen" class="fixed inset-0 bg-gray-950 flex flex-col items-center justify-center px-4 z-50">
    <div class="bg-gray-900 border border-gray-800 p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl">
      <i class="fa-solid fa-clock text-6xl text-cyan-400 mb-4 animate-pulse"></i>
      <h2 class="text-2xl font-bold mb-2">Giờ Trực</h2>
      <p class="text-gray-400 text-sm mb-8">Vui lòng đăng nhập tài khoản Google để lưu trữ và quản lý giờ trực cá nhân của bạn.</p>
      <button id="btnLogin" class="w-full bg-white hover:bg-gray-100 text-gray-900 font-semibold py-4 px-6 rounded-2xl flex items-center justify-center gap-3 active:scale-95 transition">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="Google">
        <span>Đăng nhập với Google</span>
      </button>
    </div>
  </div>

  <!-- GIAO DIỆN CHÍNH (ẨN KHI CHƯA AUTH) -->
  <div id="mainApp" class="hidden">
    <!-- HEADER -->
    <div class="bg-gray-900 border-b border-gray-800 sticky top-0 z-40">
      <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-clock text-3xl text-cyan-400"></i>
          <div>
            <h1 class="text-xl font-semibold tracking-tight">Giờ Trực</h1>
            <p id="userEmail" class="text-xs text-gray-400 truncate max-w-[150px] sm:max-w-xs">Đang tải...</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button id="btnRefresh" class="flex items-center justify-center w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-2xl text-sm font-medium transition">
            <i class="fa-solid fa-rotate"></i>
          </button>
          <button id="btnLogout" class="flex items-center gap-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 px-4 py-2 h-10 rounded-2xl text-sm font-medium transition">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span class="hidden sm:inline">Đăng xuất</span>
          </button>
        </div>
      </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 pt-6">
      <!-- TOTAL CARD -->
      <div class="total-card rounded-3xl p-6 mb-8 text-center shadow-2xl">
        <div class="flex justify-between items-center">
          <div class="text-cyan-100 text-sm font-medium tracking-widest text-left">TỔNG THỜI GIAN TRỰC</div>
          <div id="totalHours" class="text-5xl sm:text-6xl font-bold text-white">0</div>
        </div>
        <div class="text-cyan-200 text-xl font-light text-right -mt-2">giờ</div>
        <div id="totalEntries" class="text-xs text-cyan-100 mt-4 opacity-75 text-left border-t border-cyan-300/20 pt-3"></div>
      </div>

      <!-- FORM -->
      <div class="bg-gray-900 border border-gray-800 rounded-3xl p-6 mb-8 shadow-xl">
        <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
          <i class="fa-solid fa-plus text-cyan-400"></i>
          <span id="formTitle">Thêm mới giờ trực</span>
        </h2>
        
        <input type="hidden" id="editKey">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Ngày trực</label>
            <input type="date" id="ngay" 
                   class="w-full bg-gray-950 border border-gray-800 focus:border-cyan-400 rounded-2xl px-4 py-3.5 text-white text-base outline-none transition">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Số giờ trực</label>
            <div class="relative">
              <input type="number" id="so_gio" min="0" step="0.5" placeholder="0"
                     class="w-full bg-gray-950 border border-gray-800 focus:border-cyan-400 rounded-2xl px-4 py-3.5 text-white text-base outline-none transition">
              <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm">giờ</span>
            </div>
          </div>
        </div>

        <div class="flex gap-3 mt-6">
          <button id="btnSave" 
                  class="flex-1 bg-cyan-400 hover:bg-cyan-300 active:scale-95 text-black font-semibold text-base py-4 rounded-2xl flex items-center justify-center gap-2 transition">
            <i class="fa-solid fa-save"></i>
            <span id="saveBtnText">LƯU DỮ LIỆU</span>
          </button>
          
          <button id="btnClear" 
                  class="px-5 bg-gray-800 hover:bg-gray-700 active:scale-95 text-white rounded-2xl transition">
            <i class="fa-solid fa-eraser"></i>
          </button>
        </div>
      </div>

      <!-- LIST CONTAINER -->
      <div class="flex justify-between items-baseline mb-4 px-1">
        <h2 class="text-lg font-semibold">Lịch sử trực</h2>
        <div id="lastUpdated" class="text-xs text-gray-400"></div>
      </div>

      <!-- DESKTOP VIEW (≥ 640px) -->
      <div class="hidden sm:block bg-gray-900 border border-gray-800 rounded-3xl overflow-hidden shadow-xl mb-6">
        <table class="w-full">
          <thead class="bg-gray-800/50 border-b border-gray-800 text-gray-400 text-xs text-left">
            <tr>
              <th class="px-6 py-4 font-medium">Ngày</th>
              <th class="px-6 py-4 font-medium text-right">Số giờ</th>
              <th class="px-6 py-4 font-medium">Cập nhật cuối</th>
              <th class="px-6 py-4 w-28 text-center">Thao tác</th>
            </tr>
          </thead>
          <tbody id="desktopBody" class="divide-y divide-gray-800 text-sm">
            <tr>
              <td colspan="4" class="text-center py-12 text-gray-400">Đang tải dữ liệu...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- MOBILE VIEW (< 640px) -->
      <div id="mobileCards" class="block sm:hidden space-y-4">
        <p class="text-center py-12 text-gray-400">Đang tải dữ liệu...</p>
      </div>

    </div>
  </div>

  <!-- FIREBASE SCRIPTS (MODULAR SDK) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, push, update, remove, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase config của bạn
    const firebaseConfig = {
      apiKey: "AIzaSyD4B5WoLU94uGh2v3O8O0GnT1k6ELxXdqU",
      authDomain: "anuongmanhudihanhxac.firebaseapp.com",
      databaseURL: "https://anuongmanhudihanhxac-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "anuongmanhudihanhxac",
      storageBucket: "anuongmanhudihanhxac.firebasestorage.app",
      messagingSenderId: "988963755475",
      appId: "1:988963755475:web:fe2edd12724b88d7740b26"
    };

    // Khởi tạo Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let currentData = {};

    // --- DOM Elements ---
    const loginScreen = document.getElementById("loginScreen");
    const mainApp = document.getElementById("mainApp");
    const userEmail = document.getElementById("userEmail");
    const desktopBody = document.getElementById("desktopBody");
    const mobileCards = document.getElementById("mobileCards");
    const totalHoursEl = document.getElementById("totalHours");
    const totalEntriesEl = document.getElementById("totalEntries");
    const lastUpdatedEl = document.getElementById("lastUpdated");
    
    const inputKey = document.getElementById("editKey");
    const inputNgay = document.getElementById("ngay");
    const inputSoGio = document.getElementById("so_gio");
    const formTitle = document.getElementById("formTitle");
    const saveBtnText = document.getElementById("saveBtnText");

    // --- Authentication ---
    document.getElementById("btnLogin").addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        showToast("Đăng nhập thất bại: " + error.message, "error");
      }
    });

    document.getElementById("btnLogout").addEventListener("click", () => {
      if (confirm("Bạn có chắc chắn muốn đăng xuất?")) {
        signOut(auth);
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loginScreen.classList.add("hidden");
        mainApp.classList.remove("hidden");
        userEmail.textContent = user.email;
        observeData(); // Lắng nghe dữ liệu thay đổi real-time
      } else {
        currentUser = null;
        loginScreen.classList.remove("hidden");
        mainApp.classList.add("hidden");
      }
    });

    // Helper hàm lấy reference tới đường dẫn node giờ trực theo uid
    function getUserDutyRef(key = "") {
      if (!currentUser) return null;
      const basePath = `users/${currentUser.uid}/gio-truc`;
      return key ? ref(db, `${basePath}/${key}`) : ref(db, basePath);
    }

    // --- Real-time Database Operations ---
    function observeData() {
      const userDbRef = getUserDutyRef();
      if (!userDbRef) return;
      
      onValue(userDbRef, (snapshot) => {
        currentData = snapshot.val() || {};
        renderUI();
      }, (error) => {
        showToast("Lỗi đồng bộ dữ liệu: " + error.message, "error");
      });
    }

    // --- UI Renderers ---
    function renderUI() {
      let totalHours = 0;
      let count = 0;
      const itemsArray = [];

      Object.keys(currentData).forEach(key => {
        const item = currentData[key];
        totalHours += parseFloat(item.so_gio) || 0;
        count++;
        itemsArray.push({ key, ...item });
      });

      // Sắp xếp dữ liệu theo ngày mới nhất lên đầu
      itemsArray.sort((a, b) => b.ngay.localeCompare(a.ngay));

      // Render Card tổng quan
      totalHoursEl.textContent = totalHours.toLocaleString('vi-VN');
      totalEntriesEl.innerHTML = `
        Tổng số: <span class="font-semibold text-white">${count} lượt trực</span> • 
        Trung bình: <span class="font-semibold text-white">${count ? (totalHours / count).toFixed(1) : 0}</span> giờ/lượt
      `;

      lastUpdatedEl.innerHTML = `
        <i class="fa-solid fa-clock"></i> 
        Đồng bộ lúc ${new Date().toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit', second:'2-digit'})}
      `;

      // Render Desktop Table & Mobile Card
      desktopBody.innerHTML = "";
      mobileCards.innerHTML = "";

      if (itemsArray.length === 0) {
        const emptyStateText = "Chưa có bản ghi giờ trực nào.";
        desktopBody.innerHTML = `<tr><td colspan="4" class="text-center py-12 text-gray-400">${emptyStateText}</td></tr>`;
        mobileCards.innerHTML = `<div class="text-center py-12 text-gray-400 text-sm">${emptyStateText}</div>`;
        return;
      }

      itemsArray.forEach(item => {
        const dateObj = item.timestamp ? new Date(item.timestamp) : null;
        const timeFormatted = dateObj ? dateObj.toLocaleString('vi-VN', {dateStyle: 'short', timeStyle: 'short'}) : '—';

        // Dòng cho Desktop Table
        const row = document.createElement("tr");
        row.className = "hover:bg-gray-800/30 transition";
        row.innerHTML = `
          <td class="px-6 py-4 font-medium">${formatDateVN(item.ngay)}</td>
          <td class="px-6 py-4 text-right font-semibold text-base text-cyan-400">${item.so_gio} giờ</td>
          <td class="px-6 py-4 text-xs text-gray-500">${timeFormatted}</td>
          <td class="px-6 py-4 text-center">
            <div class="flex justify-center gap-2">
              <button data-key="${item.key}" class="btn-edit text-amber-400 hover:text-amber-300 p-2"><i class="fa-solid fa-pen"></i></button>
              <button data-key="${item.key}" class="btn-delete text-red-400 hover:text-red-300 p-2"><i class="fa-solid fa-trash"></i></button>
            </div>
          </td>
        `;
        desktopBody.appendChild(row);

        // Card cho Mobile View
        const card = document.createElement("div");
        card.className = "bg-gray-900 border border-gray-800 rounded-3xl p-5 shadow-md";
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <div class="text-xs text-gray-400">Ngày trực</div>
              <div class="text-base font-semibold text-white mt-0.5">${formatDateVN(item.ngay)}</div>
            </div>
            <div class="text-right">
              <div class="text-xs text-gray-400">Số giờ</div>
              <div class="text-2xl font-bold text-cyan-400">${item.so_gio} <span class="text-xs font-normal text-gray-400">giờ</span></div>
            </div>
          </div>
          <div class="mt-4 pt-3 border-t border-gray-800/80 flex justify-between items-center">
            <span class="text-[10px] text-gray-600">${timeFormatted}</span>
            <div class="flex gap-2">
              <button data-key="${item.key}" class="btn-edit bg-amber-400/10 text-amber-400 hover:bg-amber-400/20 px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition">
                <i class="fa-solid fa-pen"></i> Sửa
              </button>
              <button data-key="${item.key}" class="btn-delete bg-red-500/10 text-red-400 hover:bg-red-500/20 px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition">
                <i class="fa-solid fa-trash"></i> Xóa
              </button>
            </div>
          </div>
        `;
        mobileCards.appendChild(card);
      });

      setupActionButtons();
    }

    // --- Action Button Handlers ---
    function setupActionButtons() {
      document.querySelectorAll(".btn-edit").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const key = e.currentTarget.getAttribute("data-key");
          editItem(key);
        });
      });

      document.querySelectorAll(".btn-delete").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const key = e.currentTarget.getAttribute("data-key");
          deleteItem(key);
        });
      });
    }

    // --- Save / Edit / Delete ---
    async function saveData() {
      if (!currentUser) return;

      const key = inputKey.value;
      const ngay = inputNgay.value;
      const so_gio = parseFloat(inputSoGio.value);

      if (!ngay || isNaN(so_gio) || so_gio <= 0) {
        showToast("Vui lòng nhập ngày trực và số giờ trực hợp lệ!", "error");
        return;
      }

      const payload = {
        ngay: ngay,
        so_gio: so_gio,
        timestamp: Date.now()
      };

      try {
        if (key) {
          // Cập nhật bản ghi tại users/{uid}/gio-truc/{key}
          await update(getUserDutyRef(key), payload);
          showToast("Đã cập nhật giờ trực!", "success");
        } else {
          // Thêm mới bản ghi tại users/{uid}/gio-truc
          const newListRef = push(getUserDutyRef());
          await set(newListRef, payload);
          showToast("Đã thêm mới giờ trực thành công!", "success");
        }
        clearForm();
      } catch (err) {
        showToast("Lỗi khi lưu dữ liệu: " + err.message, "error");
      }
    }

    function editItem(key) {
      const item = currentData[key];
      if (!item) return;

      inputKey.value = key;
      inputNgay.value = item.ngay || "";
      inputSoGio.value = item.so_gio || "";

      formTitle.innerHTML = `<i class="fa-solid fa-pen text-amber-400"></i> Chỉnh sửa giờ trực`;
      saveBtnText.textContent = "CẬP NHẬT";
      
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deleteItem(key) {
      if (!currentUser) return;
      if (!confirm("Bạn có chắc chắn muốn XÓA vĩnh viễn mục này?")) return;

      try {
        await remove(getUserDutyRef(key));
        showToast("Đã xóa bản ghi giờ trực!", "success");
      } catch (err) {
        showToast("Lỗi khi xóa: " + err.message, "error");
      }
    }

    function clearForm() {
      inputKey.value = "";
      inputNgay.value = "";
      inputSoGio.value = "";
      formTitle.innerHTML = `<i class="fa-solid fa-plus text-cyan-400"></i> Thêm mới giờ trực`;
      saveBtnText.textContent = "LƯU DỮ LIỆU";
    }

    // --- Helpers ---
    function formatDateVN(dateStr) {
      if (!dateStr) return "—";
      const parts = dateStr.split("-");
      if (parts.length !== 3) return dateStr;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function showToast(message, type) {
      const toast = document.createElement("div");
      toast.style.cssText = `
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
        padding: 14px 24px; border-radius: 20px; color: white; font-weight: 500; font-size: 14px;
        display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        z-index: 9999; opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      `;
      toast.className = type === "success" ? "bg-emerald-500" : "bg-red-500";
      toast.innerHTML = `
        <i class="fa-solid ${type === "success" ? "fa-circle-check" : "fa-triangle-exclamation"}"></i>
        <span>${message}</span>
      `;
      document.body.appendChild(toast);

      requestAnimationFrame(() => {
        toast.style.transform = "translateX(-50%) translateY(0)";
        toast.style.opacity = "1";
      });

      setTimeout(() => {
        toast.style.transform = "translateX(-50%) translateY(20px)";
        toast.style.opacity = "0";
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // --- Event Listeners ---
    document.getElementById("btnSave").addEventListener("click", saveData);
    document.getElementById("btnClear").addEventListener("click", clearForm);
    document.getElementById("btnRefresh").addEventListener("click", () => {
      observeData();
      showToast("Đã đồng bộ lại dữ liệu!", "success");
    });
  </script>
</body>
</html>
